name: Laravel Docker CI/CD Pipeline

on:
  push:
    branches: [isi_burgers ]
  pull_request:
    branches: [ Burger_isi ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql
          coverage: none

      - name: Copy .env file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-scripts --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate

      - name: Directory permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/isi-burger:${{ github.sha }}

      # Webhook notification to Jenkins (if you're using Jenkins)
      - name: Notify Jenkins
        if: success()
        run: |
          curl -X POST \
            ${{ secrets.JENKINS_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{"repository":"${{ github.repository }}", "ref":"${{ github.ref }}", "sha":"${{ github.sha }}"}'
